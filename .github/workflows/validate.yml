name: Validate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tvos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -showsdks
      - name: Check generated project and public pages
        run: |
          make project site
          git diff --exit-code
      - name: Check distribution inputs and tool regressions
        run: make check
      - name: Select installed tvOS simulator
        run: python3 scripts/select_simulator.py --github-env
      - name: Unit and remote-navigation UI tests
        run: make test
      - name: Build unsigned device archive
        run: python3 scripts/archive.py archive --unsigned --output build/CI/OMTReceiver.xcarchive
      - name: Validate archived resources and packaging
        run: python3 scripts/validate_distribution.py --archive build/CI/OMTReceiver.xcarchive
      - name: Retain test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-validation-failure
          path: |
            build/Tests-*.xcresult
            build/CI/archive.log
          retention-days: 7
